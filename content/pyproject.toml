[project]
name = "content"
version = "0.1.0"
description = "NGSL card generation pipeline for VocabRoutine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
content = "content.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
